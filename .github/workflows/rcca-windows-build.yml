name: RCCA Windows-Build (Crew Chief + KI-Team)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # für die feste Download-Seite (Release "aktuell")
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: .NET SDK (für das SDK-Projekt GameOverlay)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: MSBuild einrichten
        uses: microsoft/setup-msbuild@v2

      - name: Crew Chief + KI-Team bauen (Release)
        run: |
          msbuild CrewChiefV4/CrewChiefV4.csproj -restore -p:Configuration=Release -p:Platform=AnyCPU -p:DebugSymbols=false -p:DebugType=None -p:Deterministic=true -v:minimal -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build fehlgeschlagen' }

      - name: Testprojekt bauen (Debug, wie von den Upstream-Tests verlangt)
        run: |
          msbuild UnitTest/UnitTest.csproj -restore -p:Configuration=Debug -v:minimal -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Test-Build fehlgeschlagen' }

      - name: KI-Team-Tests (müssen bestehen)
        run: |
          $env:RCCA_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'rcca-data'
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find '**\TestPlatform\vstest.console.exe' | Select-Object -First 1
          & $vstest UnitTest/bin/Debug/UnitTest.dll /Platform:x64 /TestCaseFilter:"TestCategory=AiTeam" /Logger:"trx;LogFileName=ai-team.trx" /ResultsDirectory:test-results
          if ($LASTEXITCODE -ne 0) { throw 'KI-Team-Tests fehlgeschlagen' }

      - name: Upstream-Tests (Regression, nur Bericht)
        continue-on-error: true
        run: |
          # Bekannte Ausgangslage: einige Upstream-Tests brauchen Sounddateien, die bewusst nicht im Repo liegen.
          # Langsame Makro-Tests werden ausgelassen.
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find '**\TestPlatform\vstest.console.exe' | Select-Object -First 1
          & $vstest UnitTest/bin/Debug/UnitTest.dll /Platform:x64 /TestCaseFilter:"TestCategory!=AiTeam&FullyQualifiedName!~macro" /Logger:"trx;LogFileName=upstream.trx" /ResultsDirectory:test-results

      - name: Paket schnüren
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          # Versions-Tag (v0.9.1) = offizielles Release mit Update-Hinweis in der App; sonst Entwicklungsstand
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "dev-$sha" }
          ./build/package.ps1 -OutDir dist/RobertsCrewChiefAdvanced -PublicDistribution -Version $version
          $out = 'dist/RobertsCrewChiefAdvanced'
          # VERSION.txt and its manifest are generated together by package.ps1; do not invalidate the hashes.
          Compress-Archive -Path "$out/*" -DestinationPath "dist/RobertsCrewChiefAdvanced-Alpha-$sha-win-x64.zip" -Force
          Copy-Item "dist/RobertsCrewChiefAdvanced-Alpha-$sha-win-x64.zip" "dist/RobertsCrewChiefAdvanced.zip"
          # Prüfsumme für das Update in der App
          (Get-FileHash dist/RobertsCrewChiefAdvanced.zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  RobertsCrewChiefAdvanced.zip" | Set-Content -NoNewline -Encoding ascii dist/RobertsCrewChiefAdvanced.zip.sha256

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Alpha-ZIP hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RobertsCrewChiefAdvanced-Alpha-win-x64
          path: dist/RobertsCrewChiefAdvanced-Alpha-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Download-Seite aktualisieren (Release "aktuell")
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aktuell --yes --cleanup-tag 2>$null
          $notes = "Aktuelle Testversion (Commit $($env:GITHUB_SHA.Substring(0,7))). ZIP komplett in einen neuen Ordner entpacken und CrewChiefV4.exe starten. Anleitung mit Bildern im Paket: ANLEITUNG_RRCA_DE.pdf (EN: GUIDE_RRCA_EN.pdf, ES: GUIA_RRCA_ES.pdf). Fehler bitte als Issue oder im Forenthread auf virtualracing.org melden."
          # Vorabversion: zählt nicht als neueste Version, löst also keinen Update-Hinweis aus
          gh release create aktuell dist/RobertsCrewChiefAdvanced.zip dist/RobertsCrewChiefAdvanced.zip.sha256 --target $env:GITHUB_SHA --title "RRCA – Entwicklungsstand" --notes $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht angelegt werden' }

      - name: Offizielles Release (Versions-Tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "RRCA $($env:GITHUB_REF_NAME). Download: RobertsCrewChiefAdvanced.zip. Installation and setup: https://github.com/JoshuaGerke/RobertsCrewChiefAdvanced#readme (Deutsch: README_DE.md, Español: README_ES.md). If you already use RRCA, it offers this update itself."
          gh release create $env:GITHUB_REF_NAME dist/RobertsCrewChiefAdvanced.zip dist/RobertsCrewChiefAdvanced.zip.sha256 --verify-tag --title "RRCA $($env:GITHUB_REF_NAME)" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht angelegt werden' }
