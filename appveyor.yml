# This has to be the same on main and HTMLhelp branches
# so that merging main changes into HTMLhelp maintains the functionality

# HTMLhelp branch actually updating the gitlab pages files
-
  branches:
    only:
      - HTMLhelp

  only_commits:
    message: /Appveyor merge main had 'update Help' change/       # Start a new build if message generated by main change

  version: 4.15.0.{build}
  image: Visual Studio 2019
  configuration: Release
  # Update the HelpFiles.exe release version (turned off)
  # AppVeyor has a built-in task 'assembly_info' for setting values in AssemblyInfo files during the build.
  # https://www.appveyor.com/docs/build-configuration/
  assembly_info:
    patch: false
    file: 'HelpFiles\AssemblyInfo.*'
    assembly_version: '{version}'
    assembly_file_version: '{version}'
    assembly_informational_version: '{version}'

  # Build HelpFiles.exe every time
  build_script:
  - cmd: >-
      nuget restore

      cd HelpFiles

      msbuild HelpFiles.csproj /t:Rebuild /p:Configuration=Release

      cd bin\Release

      HelpFiles.exe

      cd ..\..\..

      cd public


  on_success:
        # Personal Access Token giving AppVeyor write access to https://gitlab.com/mr_belowski/CrewChiefV4
    -   environment:
    -     access_token:
    -       secure: 4ZiOruzeWdJ/+gUaGHZG2uXznoHKpZu0LmJFMPxIwrs=

    # Push any new files in public/ so they're published to
    # https://mr_belowski.gitlab.io/CrewChiefV4/index.html
    - git config --global credential.helper store
    - ps: Add-Content "$env:USERPROFILE\.git-credentials" "https://oauth2:$($env:access_token)@gitlab.com`n" -NoNewline
    - git config --global user.email "crewchiefTony@outlook.com"
    - git config --global user.name "Tony Whitley"
    - git checkout HTMLhelp
    - git add ./
    # git diff --quiet && git diff --staged --quiet ensures only commit if files changed
    - git diff --quiet && git diff --staged --quiet || git commit -am "Appveyor update public/ files" && git push

#####################################################################################################
# If main change is made with 'update Help' in the message then merge main 
# to HTMLhelp (kicking off the above)
-
  branches:
    only:
      - main

  # Including commits with particular message or from specific user
  only_commits:
      message: /update Help/        # Start a new build if message contains 'update Help'
      # author: mr_belowski         # Start a new build for commit of user with email mr_belowski (untested)

  # Empty build script to avoid error "Specify which project or solution file to use because the folder contains more than one project or solution file"
  build_script:
        - cmd: >-
        - cd .  

  on_finish:
  # Personal Access Token giving AppVeyor write access to https://gitlab.com/mr_belowski/CrewChiefV4
    - environment:
    -   access_token:
    -     secure: 4ZiOruzeWdJ/+gUaGHZG2uXznoHKpZu0LmJFMPxIwrs=

    - git config --global credential.helper store
    - ps: Add-Content "$env:USERPROFILE\.git-credentials" "https://oauth2:$($env:access_token)@gitlab.com`n" -NoNewline
    - git config --global user.email "crewchiefTony@outlook.com"
    - git config --global user.name "Tony Whitley"
    - git checkout origin/HTMLhelp
    #BROKEN - git merge origin/main
    # git diff --quiet && git diff --staged --quiet ensures only commit if files changed 
    # (not working now so commit anyway) 
    - git commit -am "Appveyor merge main had 'update Help' change" && git pull && git push

#######################################################################################################
-
  branches:
    only:
      #- main
      - branch-that-doesnt-exist

  version: 4.18.4.{build}
  image: Visual Studio 2019
  configuration: Release
  # Update the CrewChiefV4.exe release version (turned back on)
  # AppVeyor has a built-in task for setting values in AssemblyInfo files during the build.
  # https://www.appveyor.com/docs/build-configuration/#assemblyinfo-patching
  assembly_info:
    patch: false
    file: 'CrewChiefV4\Properties\AssemblyInfo.*'
    assembly_version: '{version}'
    assembly_file_version: '{version}'
    assembly_informational_version: '{version}'

  # Build CrewChiefV4_installer\Installs\CrewChiefV4-{version}.msi  every time 
  # if this is an active branch (see branches: above)
  build_script:
  - cmd: >-
      nuget restore

      cd CrewChiefV4
      
      msbuild CrewChiefV4.csproj /t:Rebuild /p:Configuration=Release
      
      cd ..
      
      cd CrewChiefV4_installer
      
      msbuild CrewChiefV4_installer.wixproj /t:Rebuild /p:Configuration=Release

      dir Installs

      cd ..
      
    artifacts:
      paths:
        ## hmm, seems only artifact is CrewChiefV4_installer/Installs/CrewChiefV4.msi
        - CrewChiefV4_installer/Installs/CrewChiefV4*.msi
